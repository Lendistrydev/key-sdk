openapi: 3.0.0
info:
  description: APIs used by partner office to interact with lendistry
  version: "1.0"
  title: API RESOURCES
  license:
    name: Partner Office API
tags:
  - name: Pre-Qualification API
    description: API to get a approximate qualification decision before filling out the
      application
  - name: Application
    description: APIs to work with application
paths:
  /partner/sbl-offer/v1/prequal/{tenantId}:
    post:
      tags:
        - Offers
      summary: Pre-qualification
      description: API that gets a pre-qualification status prior to applicant filling out their application
      operationId: prequalUsingPOST
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreQualRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreQualResponse"
        "201":
          description: Created
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
  /partner/sbl-offer/v1/offer/{tenantId}/{id}:
    get:
      tags:
        - Offers
      summary: Get Offer
      description: Gets Offer
      operationId: getOffer
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
        - name: id
          in: path
          description: id of an offer
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantOfferResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
  /partner/sbl-offer/v2/offer/{tenantId}/{id}:
    get:
      tags:
        - Offers
      summary: Get Offer V2
      description: Gets Offer V2
      operationId: getOfferV2
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
        - name: id
          in: path
          description: id of an offer
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TenantOfferResponseV2'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  "/partner/sbl-app/v1/appinstances/{tenantId}/{id}":
    get:
      tags:
        - Application Instances
      summary: Get App Instance
      description: Get a specific application instance by ID
      operationId: get-app-instances-using-GET
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
        - name: id
          in: path
          description: Application instance id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  /partner/sbl-offer/v1/loans/smbcontractor:
    get:
      summary: Get SMB Contractor Loans
      description: Retrieve loan information for SMB contractors.
      parameters:
        - name: grant_type
          in: query
          required: true
          description: The type of grant being requested.
          schema:
            type: string
            example: refresh_token
        - name: refresh_token
          in: query
          required: true
          description: The refresh token for the request.
          schema:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJmNTk2NmRmNC0yNGM2LTQxMjktODY4Ni02YTFjOTk1M2Y3NDEifQ...
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  # Define the properties of the response here
                  # Example:
                  status:
                    type: string
                    example: success
        '401':
          description: Unauthorized
        '400':
          description: Bad Request
      security:
        - bearerAuth: []
  /loans/smbcontractor/customer/{customerId}:
    get:
      summary: Get Loan Details
      description: Retrieve loan information for a specific SMB contractor customer.
      operationId: getLoanDetails
      parameters:
        - name: customerId
          in: path
          required: true
          description: The ID of the customer.
          schema:
            type: string
      responses:
        '200':
          description: Successful response with loan details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loanId:
                    type: string
                  amount:
                    type: number
                    format: double
                  status:
                    type: string
        '401':
          description: Unauthorized - Invalid token
        '404':
          description: Customer not found
      security:
        - bearerAuth: []
      tags:
        - Loans
   
servers:
  - url: https://services.mylendistry.com
    description: Lendistry Prod Server
components:
  schemas:
    TenantOfferResponseV2:
      title: TenantOfferResponseV2
      type: object
      properties:
        offerId:
          type: string
        partnerName:
          type: string
        applicationInstanceId:
          type: string
        expirationDate:
          type: string
          format: date-time
        partnerOfferData:
          type: object
        productCode:
          type: string
        tenantLoanId:
          type: string
        applyUrl:
          type: string
          description: apply url with signature parameter which can be used to validate url
        applicationDetails:
          $ref: "#/components/schemas/ApplicationDetails"
        loanDetails:
          $ref: "#/components/schemas/LoanDetails"
    LoanDetails:
      title: LoanDetails
      type: object
      properties:
        availableToWithdraw:
          type: number
          format: bigdecimal
        availableToDraw:
          type: number
          format: bigdecimal
        creditLimit:
          type: number
          format: bigdecimal
        balance:
          type: number
          format: bigdecimal
        amountDrawnDown:
          type: number
          format: bigdecimal
        effectiveBalanceDate:
          type: string
    ApplicationDetails:
      title: ApplicationDetails
      type: object
      properties:
        companyName:
          type: string
        dbaName:
          type: string
        status:
          type: string
          enum:
            - AUTOMATED_REVIEW_ADDITIONAL_DOCS_REQUIRED
            - AUTOMATED_REVIEW_APPROVED
            - AUTOMATED_REVIEW_DECLINED
            - AUTOMATED_REVIEW_INPROGRESS
            - AWAITING_ADDITIONAL_SYSTEM_DATA
            - BORROWER_ABANDONED
            - BORROWER_AGREEMENT_ACCEPTED
            - BORROWER_CHANGES_REQUIRED
            - BORROWER_SUBMITTED
            - CLOSED
            - CREATED
            - INPROGRESS
            - MANUAL_REVIEW_APPROVED
            - MANUAL_REVIEW_APPROVED_WAITLISTED
            - MANUAL_REVIEW_DECLINED
            - MANUAL_REVIEW_DOCS_REQUIRED
            - MANUAL_REVIEW_DOCS_REQUIRED_SALES
            - MANUAL_REVIEW_REQUIRED
            - MANUAL_REVIEW_REQUIRED_SALES
            - PENDING_SELECTION
            - PENDING_SELECTION_DOCS_REQUIRED
            - SUSPENSE
        applicants:
          type: array
          items:
            $ref: '#/components/schemas/Applicant'
    Applicant:
      title: Applicant
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
    TenantOfferResponse:
      title: TenantOfferResponse
      type: object
      properties:
        applicationInstanceId:
          type: string
        expirationDate:
          type: string
          format: date-time
        offerId:
          type: string
        partnerName:
          type: string
        partnerOfferData:
          type: object
        productCode:
          type: string
        tenantLoanId:
          type: string
        applyUrl:
          type: string
          description: apply url with signature parameter which can be used to validate url
    TenantOffer:
      title: TenantOffer
      type: object
      properties:
        applicationId:
          type: string
        applicationInstanceId:
          type: string
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        id:
          type: string
        partnerName:
          type: string
        partnerOfferData:
          type: object
        partnerOfferId:
          type: string
        productCode:
          type: string
        startDate:
          type: string
          format: date-time
        tenantId:
          type: string
        tenantLoanId:
          type: string
        updateDate:
          type: string
          format: date-time
        updateReason:
          type: string
        updatedBy:
          type: string
        user:
          type: string
        version:
          type: integer
          format: int32
    PreQualRequest:
      title: PreQualRequest
      type: object
      required:
        - businessLegalEntityType
        - businessName
        - businessPhoneNumber
        - businessZipCode
        - creditScoreRating
        - currency
        - loanAmount
        - loanPurpose
        - loanUrgency
        - monthlyRevenueRange
        - owners
      properties:
        businessLegalEntityType:
          type: string
        businessName:
          type: string
        businessPhoneNumber:
          type: string
        businessZipCode:
          type: string
        creditScoreRating:
          type: string
          enum:
            - ABOVE_AVERAGE
            - AVERAGE
            - EXCELLENT
            - POOR
        currency:
          type: string
