        loanAmount:
          type: number
          format: bigdecimal
        loanPurpose:
          type: string
        loanUrgency:
          type: string
        monthlyRevenueRange:
          $ref: '#/components/schemas/MonthlyRevenueRange'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        meta:
          type: object
          additionalProperties: true
          description: meta is free-form object and can contain nested objects with key of type string and value of arbitrary shape
    AppInstanceDto:
      title: AppInstanceDto
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - AUTOMATED_REVIEW_ADDITIONAL_DOCS_REQUIRED
            - AUTOMATED_REVIEW_APPROVED
            - AUTOMATED_REVIEW_DECLINED
            - AUTOMATED_REVIEW_INPROGRESS
            - AWAITING_ADDITIONAL_SYSTEM_DATA
            - BORROWER_ABANDONED
            - BORROWER_AGREEMENT_ACCEPTED
            - BORROWER_CHANGES_REQUIRED
            - BORROWER_SUBMITTED
            - CLOSED
            - CREATED
            - INPROGRESS
            - MANUAL_REVIEW_APPROVED
            - MANUAL_REVIEW_APPROVED_WAITLISTED
            - MANUAL_REVIEW_DECLINED
            - MANUAL_REVIEW_DOCS_REQUIRED
            - MANUAL_REVIEW_DOCS_REQUIRED_SALES
            - MANUAL_REVIEW_REQUIRED
            - MANUAL_REVIEW_REQUIRED_SALES
            - PENDING_SELECTION
            - PENDING_SELECTION_DOCS_REQUIRED
            - SUSPENSE
        updated_at:
          type: string
          format: date-time
    Owner:
      title: Owner
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    PreQualResponse:
      title: PreQualResponse
      type: object
      properties:
        loanOffer:
          type: array
          items:
            $ref: '#/components/schemas/LoanOffer'
        qualificationDecision:
          type: string
          enum:
            - APPROVED
            - DECLINED
    LoanOffer:
      title: LoanOffer
      type: object
      properties:
        loanFee:
          type: string
        loanFeeUnit:
          type: string
        loanTerm:
          type: integer
          format: int32
        maxLoanAmount:
          type: number
          format: bigdecimal
        maxRate:
          type: number
          format: bigdecimal
        minLoanAmount:
          type: number
          format: bigdecimal
        minRate:
          type: number
          format: bigdecimal
        offerId:
          type: string
        productCode:
          type: string
        termUnit:
          type: string
        rateUnit:
          type: string
        monthlyPayment:
          type: number
          format: bigdecimal
    MonthlyRevenueRange:
      title: MonthlyRevenueRange
      type: object
      properties:
        max:
          type: number
          format: bigdecimal
        min:
          type: number
          format: bigdecimal
    EncryptedDto:
      type: object
      properties:
        data:
          type: string
      title: EncryptedDto
    ErrorCode:
      title: ErrorCode
      type: object
    ErrorFieldInfo:
      title: ErrorCode
      type: object
      properties:
        field:
          type: object
        code:
          type: object
        message:
          type: object
        objectName:
          type: object
        rejectedValue:
          type: object
    ErrorDTO:
      title: ErrorDTO
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        info:
          $ref: '#/components/schemas/ErrorFieldInfo'
        message:
          type: string
    ErrorResponseDTO:
      title: ErrorResponseDTO
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDTO'
        id:
          type: string
          format: uuid