openapi: 3.0.0
info:
  description: APIs used by partner office to interact with lendistry
  version: "1.0"
  title: Partner API Resources
  license:
    name: Partner Office API
tags:
  - name: Pre-Qualification API
    description:
      API to get a approximate qualification decision before filling out the
      application
  - name: Application
    description: APIs to work with application
paths:
  /realms/partner-office/protocol/openid-connect/token:
    post:
      tags:
        - Authentication
      summary: Obtain Bearer or Refresh Token
      operationId: tokenUsingPOST
      description: |-
        This endpoint allows Lendistry's partners to obtain both an access token (Bearer token) and a refresh token, depending on the `grant_type` used.

        - **To obtain a Bearer token:** Set `grant_type` to `password` and provide the encrypted username and password that Lendistry provided during onboarding.
        - **To obtain a new access token using a refresh token:** Set `grant_type` to `refresh_token` and provide the refresh token that was previously issued.

        Both the access token and the refresh token are used for authenticating future API calls.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  description: Provides the OAuth 2.0 grant type.
                  enum:
                    - password
                    - refresh_token
                  default: password
                username:
                  type: string
                  description: API Username received during Onboarding (required if `grant_type` is `password`)
                password:
                  type: string
                  description: API Password received during Onboarding (required if `grant_type` is `password`)
                refresh_token:
                  type: string
                  description: Refresh Token received during authentication (required if `grant_type` is `refresh_token`)
      responses:
        "200":
          description: Successful response containing access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseDTO"
        "201":
          description: Created
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found

  /partner/sbl-offer/v1/prequal/{tenantId}:
    post:
      tags:
        - Offers
      summary: Prequalify a Client for an Offer
      description: |-
        This API retrieves the pre-qualification status of a customer based on information submitted by the partner before the customer fills out their application.

        You must include:
        - The access token, obtained from the `/realms/partner-office/protocol/openid-connect/token` endpoint.
        - The Bearer token in the `Authorization` header for this request.

      operationId: prequalUsingPOST
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreQualRequest"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PreQualResponse"
        "201":
          description: Created
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  /partner/sbl-offer/v2/offer/{tenantId}/{id}:
    get:
      tags:
        - Offers
      summary: Get Offer Details
      description: |-
        Retrieve the details of a specific offer using the tenant ID and the offer ID.

        You must include:
        - The `offerId` from the `/partner/sbl-offer/v1/prequal/{tenantId}` prequalification call.
        - The Bearer token, obtained from the `/realms/partner-office/protocol/openid-connect/token` endpoint, in the `Authorization` header.

      operationId: getOfferV2
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
        - name: id
          in: path
          description: id of an offer
          required: true
          style: simple
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TenantOfferResponseV2"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  "/partner/sbl-app/v1/appinstances/{tenantId}/{id}":
    get:
      tags:
        - Application Instances
      summary: Get Application Details
      description: |-
        Retrieve the application details using the tenant ID and the application instance ID.

        You must include:
        - The `application instance ID`, which must be obtained from the `/partner/sbl-offer/v2/offer/{tenantId}/{id}` offer details call.
        - The Bearer token, obtained from the `/realms/partner-office/protocol/openid-connect/token` endpoint, in the `Authorization` header.

      operationId: get-app-instances-using-GET
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: tenantId
          in: path
          description: tenant value provided by lendistry team
          required: true
          style: simple
          schema:
            type: string
        - name: id
          in: path
          description: Application instance id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "401":
          description: Unauthorized (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "403":
          description: Forbidden (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Not Found (not encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  /partner/sbl-offer/v1/loans/smbcontractor:
    get:
      summary: Get All Loans
      description: |-
        Retrieve all loans created under the current partner.

        You must provide:
        - A valid Bearer token in the `Authorization` header (e.g., "Bearer <access_token>").

        The token should be obtained from the `/realms/partner-office/protocol/openid-connect/token` endpoint.

      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        "401":
          description: Unauthorized
        "400":
          description: Bad Request
      security:
        - bearerAuth: []
      tags:
        - Loans

  /partner/sbl-offer/v1/loans/smbcontractor/customer/{customerId}:
    get:
      summary: Get Specific Customer Loan Information
      description: |-
        Retrieve loan information for a specific customer using their customer ID.

        You must provide:
        - A valid Bearer token in the `Authorization` header (e.g., "Bearer <access_token>").

        The customer ID is required as a path parameter to specify which customer's loan details to retrieve.

      operationId: getLoanDetails
      parameters:
        - name: Authorization
          in: header
          description: Bearer token, e.g. "Bearer <access_token here>"
          required: true
          schema:
            type: string
        - name: customerId
          in: path
          required: true
          description: The ID of the customer.
          schema:
            type: string
      responses:
        "200":
          description: Successful response with loan details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loanId:
                    type: string
                  amount:
                    type: number
                    format: double
                  status:
                    type: string
        "401":
          description: Unauthorized - Invalid token
        "404":
          description: Customer not found
      security:
        - bearerAuth: []
      tags:
        - Loans

servers:
  - url: https://services.mylendistry.com
    description: Lendistry Prod Server
